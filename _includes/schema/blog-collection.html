<!-- Schema.org Blog Collection markup -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "Blog Posts",
  "description": "Technical blog posts about Machine Learning, Deep Learning, and Computer Vision",
  "url": {{ '/#posts' | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "ItemList",
    "itemListElement": [
      {% assign selected_posts = site.posts | where: "selected", "y" %}
      {% for post in selected_posts limit: site.data.main_info.posts_to_show %}
      {
        "@type": "ListItem",
        "position": {{ forloop.index }},
        "item": {
          "@type": "BlogPosting",
          "headline": {{ post.title | jsonify }},
          "url": {{ post.external-url | default: post.url | absolute_url | jsonify }},
          "image": {{ post.image | absolute_url | jsonify }},
          "datePublished": {{ post.date | date_to_xmlschema | jsonify }},
          "author": {
            "@type": "Person",
            "@id": {{ '/#person' | absolute_url | jsonify }}
          },
          "description": {{ post.description | strip_html | strip_newlines | strip | jsonify }}
        }
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
}
</script>
