<!-- Schema.org Person/ProfilePage markup -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ '/' | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "@id": {{ '/#person' | absolute_url | jsonify }},
    "name": {{ site.data.main_info.name | jsonify }},
    "jobTitle": {{ site.data.main_info.job_title | jsonify }},
    "worksFor": {
      "@type": "Organization",
      "name": {{ site.data.main_info.employer | jsonify }},
      "url": {{ site.data.main_info.employer_url | jsonify }}
    },
    "email": {{ site.data.main_info.email | prepend: 'mailto:' | jsonify }},
    "image": {{ site.data.main_info.profile_pic | absolute_url | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "sameAs": [
      {{ site.data.main_info.linkedin | jsonify }},
      {{ site.data.main_info.github | jsonify }},
      {{ site.data.main_info.twitter_url | jsonify }},
      {{ site.data.main_info.medium | jsonify }},
      {{ site.data.main_info.stackoverflow | jsonify }}
    ],
    "knowsAbout": [
      "Machine Learning",
      "Deep Learning",
      "Computer Vision",
      "Multi-Object Tracking",
      "Object Detection",
      "Camera Calibration",
      "Generative Models",
      "MLOps",
      "PyTorch",
      "Sports Analytics"
    ],
    "alumniOf": [
      {
        "@type": "EducationalOrganization",
        "name": "Purdue University",
        "url": "https://www.purdue.edu/"
      },
      {
        "@type": "EducationalOrganization",
        "name": "Polytechnic University of Catalonia",
        "url": "https://www.upc.edu/en"
      },
      {
        "@type": "EducationalOrganization",
        "name": "University of A Coruña",
        "url": "https://www.udc.es/"
      }
    ],
    "description": "Senior Machine Learning Engineer at Hudl specializing in computer vision systems for sports analytics. Expert in multi-object tracking, camera calibration, object detection, and production-scale AI systems."
  }
}
</script>
