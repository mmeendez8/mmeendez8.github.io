<!-- Schema.org Work Experience markup -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {% assign filtered_experiences = site.data.experience.experiences | where_exp: "exp", "exp.title contains 'Engineer' or exp.title contains 'Scientist' or exp.title contains 'Consultant'" %}
    {% for exp in filtered_experiences %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "OrganizationRole",
        "roleName": {{ exp.title | jsonify }},
        "member": {
          "@type": "Person",
          "@id": {{ '/#person' | absolute_url | jsonify }}
        },
        "memberOf": {
          "@type": "Organization",
          "name": {{ exp.company | jsonify }},
          "url": {{ exp.url | jsonify }},
          "address": {
            "@type": "PostalAddress",
            "addressLocality": {{ exp.location | strip | jsonify }}
          }
        },
        "description": {{ exp.description | strip_html | strip_newlines | strip | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
