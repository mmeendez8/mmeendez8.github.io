<!-- Schema.org Software Projects markup -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {% for project in site.data.other_projects.other_projects %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "SoftwareSourceCode",
        "name": {{ project.title | jsonify }},
        "description": {{ project.description | strip_html | strip_newlines | strip | jsonify }},
        "url": {{ project.code | jsonify }},
        "codeRepository": {{ project.code | jsonify }},
        "author": {
          "@type": "Person",
          "@id": {{ '/#person' | absolute_url | jsonify }}
        },
        "programmingLanguage": "Python",
        "keywords": {{ project.tags | replace: '#', '' | strip | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
