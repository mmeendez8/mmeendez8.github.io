<!-- schema.org markup to help SEO (values computed in page_meta.html) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page_description | jsonify }},
  "url": {{ canonical_url | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ canonical_url | jsonify }}
  },
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "author": {
    "@type": "Person",
    "@id": {{ '/#person' | absolute_url | jsonify }},
    "name": {{ site.data.main_info.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "@id": {{ '/#person' | absolute_url | jsonify }},
    "name": {{ site.data.main_info.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}
  },
  "image": {
    "@type": "ImageObject",
    "url": {{ social_image | jsonify }},
    "width": {{ social_image_width }},
    "height": {{ social_image_height }}
  },
  "keywords": {{ page.tags | jsonify }},
  "articleSection": {{ page.categories | first | jsonify }},
  "wordCount": {{ page.content | strip_html | number_of_words }},
  "inLanguage": "en"
}
</script>
