  <!-- Twitter cards (values computed in page_meta.html) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ site.data.main_info.twitter }}">
  <meta name="twitter:creator" content="@{{ site.data.main_info.twitter }}">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page_description | escape }}">
  <meta name="twitter:image" content="{{ social_image }}">
  <meta name="twitter:image:alt" content="{{ social_image_alt | escape }}">
  <!-- end of Twitter cards -->
