news:
  - month: "October"
    year: "2026"
    type: "release"
    title: "StatsBomb 360 adds AI-powered player ID"
    text: "Hudl <a href='https://www.hudl.com/blog/statsbomb-360-upgrade-adds-ai-powered-player-id' target='_blank' rel='noopener noreferrer'>upgraded StatsBomb 360 with AI-powered player identification</a>: every player in each 360 freeze frame is now named and linked to the event data. Built on the broadcast tracking I've been developing at Hudl."
  - month: "June"
    year: "2026"
    type: "release"
    title: "Hudl Raw Tracking (XY) Data API ships"
    text: "Hudl released its <a href='https://www.hudl.com/blog/hudl-raw-xy-data-release-api' target='_blank' rel='noopener noreferrer'>Raw Tracking (XY) Data API</a>! Automated player tracking from single-camera broadcast footage at scale (120+ competitions). I've been working on the computer vision behind it since joining Hudl."
  - month: "August"
    year: "2024"
    type: "career"
    title: "Statsbomb joins Hudl"
    text: "<a href='https://x.com/mmeendez8/status/1823003417670762904' target='_blank' rel='noopener noreferrer'> Statsbomb have been acquired by Hudl!</a> I am excited to continue working on the future of sports analytics with the Hudl team."
  - month: "September"
    year: "2023"
    type: "writing"
    title: "Homography estimation on the Statsbomb blog"
    text: "Published a blog post about homography estimation in Statsbomb blog [<a href='https://statsbomb.com/articles/football/creating-better-data-ai-homography-estimation/' target='_blank' rel='noopener noreferrer'>English</a>, <a href='https://statsbomb.com/es/articulos/futbol/nuevas-tecnologias/ia-y-los-datos-deportivos-la-estimacion-de-homografia/' target='_blank' rel='noopener noreferrer'>Spanish</a>]."
  - month: "February"
