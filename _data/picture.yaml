media_queries:
  mobile: 'max-width: 767px'
  desktop: "min-width: 768px"

presets:

  # Open Graph / Twitter preview image: a single 1200x630 JPG URL (no markup)
  social:
    markup: direct_url
    fallback_format: jpg
    fallback_width: 1200
    crop: '40:21'

  profile:
    formats: [webp]
    widths: [200, 400, 600, 800, 1500]
    dimension_attributes: true
    attributes:
      img: 'fetchpriority="high"'
    sizes:
      desktop: 280px
      mobile: 220px
    size: 400px
    fallback_width: 400

  posts-grid:
    formats: [webp]
    widths: [400, 600, 700, 800, 1000, 1500]
    dimension_attributes: true
    attributes:
      img: 'loading="lazy" decoding="async"'
    # Card width: full width minus the 2.4rem gutters on phones; two columns
    # (gap 3.2rem) of the container on desktop, capped at the 1000px container.
    sizes:
      mobile: calc(100vw - 48px)
    size: min(460px, calc(50vw - 40px))

  exp-logos:
    formats: [webp]
    widths: [120]
    dimension_attributes: true
    attributes:
      img: 'loading="lazy"' 

  # Post hero. Browsers pick the smallest width >= rendered width x device pixel
  # ratio, so the small sizes only go to small screens and nothing is upscaled.
  thumbnail:
    formats: [webp]
    widths: [480, 640, 800, 1000, 1200, 1500, 2000]
    dimension_attributes: true
    attributes:
      img: 'fetchpriority="high"' 
    sizes:
      mobile: 100vw
    size: 50vw

  pimage:
    formats: [webp]
    widths: [400, 800, 1500, 2000]
    dimension_attributes: true
    attributes:
      img: 'loading="lazy"' 
    noscript: true
    sizes:
      mobile: 100vw
    size: 80vw
    link_source: true
    nomarkdown: false
